# Put a released version back on ream.deityhub.com (Actions → Deploy a version → Run workflow), for when the
# Cloudflare dashboard's Rollback can't: its deployment history is gone, or a fix has to go out from a tag.
# The version is built again from its tag, exactly as it was released.
name: Deploy a version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to deploy, like 0.1.0 (its tag is v0.1.0)'
        required: true

permissions:
  contents: read

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the tag goes in repo/: wrangler-action, run from the working directory, must not find the project's package.json
      # (the runner's own Yarn 1 refuses to run in a project pinned to Yarn 4)
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          path: repo
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: repo
      - run: yarn build
        working-directory: repo
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy repo/apps/web/dist --project-name ream --branch main --commit-message "v${{ inputs.version }} (deployed again)"
