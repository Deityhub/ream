# Ream's pipeline. Linux only, a few minutes a run, inside GitHub's free allowance.
#   pull request into dev    check, then a preview deploy (<branch>.ream-bqb.pages.dev) with its link on the PR
#   pull request into main   check, and the version must be new (a release: see CONTRIBUTING.md)
#   merge into main          check, then production (ream.deityhub.com), the v<version> tag, a GitHub Release and the
#                            Docker image (ghcr.io/deityhub/ream, docker.io/deityhub/ream)
# A released version can be put back with the Deploy a version workflow (deploy-version.yml).
# Plain pushes to other branches run nothing. `check` is the status the branch rules require
# (.github/rulesets/protect-dev-main.json).
name: Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # a newer push to the same pull request replaces the run in progress; runs on main always finish
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags, for the version check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: The version is new (releases only)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: node scripts/release.ts check
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: node scripts/notices.ts --check
      - run: yarn build
      - run: node scripts/seo-check.ts
      - name: The Docker image builds, serves the app and sends the security headers
        run: |
          docker build -t ream:check .
          docker run -d --name ream -p 8080:8080 ream:check
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers() { curl -sS -o /dev/null -D - "http://localhost:8080$1" | tr -d '\r'; }
          fail() { echo "::error::$1"; docker logs ream; exit 1; }
          headers / | grep -q '^HTTP/1.1 200' || fail 'the page is not served'
          headers / | grep -qi "^content-security-policy: default-src 'self'" || fail 'no security policy on the page'
          headers /sw.js | grep -qi '^cache-control: no-cache' || fail 'sw.js is cached'
          headers /manifest.webmanifest | grep -qi '^content-type: application/manifest+json' || fail 'the manifest has the wrong type'
          asset=$(docker exec ream sh -c 'ls /usr/share/nginx/html/assets | head -1')
          headers "/assets/$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable' || fail 'assets are not cached for good'
          headers /no-such-file | grep -q '^HTTP/1.1 404' || fail 'a missing file is not a 404'
          page() { curl -sS "http://localhost:8080$1"; }
          headers /tools/pdf/compress-pdf/ | grep -q '^HTTP/1.1 200' || fail 'a tool page is not served'
          page /tools/pdf/compress-pdf/ | grep -q '<title>Compress PDF' || fail 'the tool page has the wrong title'
          page /tools/pdf/compress-pdf/ | grep -q 'rel="canonical" href="https://ream.deityhub.com/tools/pdf/compress-pdf/"' || fail 'the tool page has no canonical address'
          headers /sitemap.xml | grep -q '^HTTP/1.1 200' || fail 'no sitemap'
          page /sitemap.xml | grep -q '/tools/pdf/merge-pdf/' || fail 'the sitemap lacks a tool'
          for gone in /tools/pdf/no-such-tool/ /tools/image/sign-pdf/ /tools/video/ /tool/compress-pdf/; do
            headers "$gone" | grep -q '^HTTP/1.1 404' || fail "$gone is not a 404"
          done
          page /tools/pdf/no-such-tool/ | grep -q 'noindex' || fail 'the 404 page can be indexed'
          [ "$(docker exec ream id -u)" != 0 ] || fail 'NGINX runs as root'
          echo "image: $(docker image inspect ream:check --format '{{.Size}}') bytes"
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/dist
          include-hidden-files: true # _headers
          retention-days: 1

  preview:
    # pull requests from forks can't see the Cloudflare secrets: they get the checks only
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ream --branch "${{ github.head_ref }}" --commit-hash "${{ github.event.pull_request.head.sha }}"
      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          body="Preview of ${{ github.event.pull_request.head.sha }}: ${ALIAS:-$URL}"
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$body" --edit-last --create-if-none

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one production deploy at a time (this job and deploy-version.yml)
    concurrency: production
    permissions:
      contents: write # the tag and the GitHub Release
      packages: write # the image on ghcr.io
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # the repo goes in repo/, not the working directory: wrangler-action picks its package manager from the files
      # it finds there, and the runner's own Yarn 1 refuses to run in a project pinned to Yarn 4
      - uses: actions/checkout@v7
        with:
          path: repo
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # scripts/release.ts is TypeScript, run directly
      - id: version
        run: echo "version=$(node repo/scripts/release.ts version)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ream --branch main --commit-hash "${{ github.sha }}" --commit-message "v${{ steps.version.outputs.version }}"
      - name: Tag the release, with its CHANGELOG.md section as the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node repo/scripts/release.ts notes > notes.md
          gh release create "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v${{ steps.version.outputs.version }}" --notes-file notes.md
      # the image for self-hosting: Intel/AMD and ARM, tagged with the version and latest. The site is built once, on
      # the runner's own platform; each platform's image only copies the files, so no emulation is needed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: tags
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          tags="ghcr.io/deityhub/ream:$V,ghcr.io/deityhub/ream:latest"
          # Docker Hub only once its secrets are set
          if [ -n "$DOCKERHUB_TOKEN" ]; then tags="$tags,docker.io/$DOCKERHUB_USERNAME/ream:$V,docker.io/$DOCKERHUB_USERNAME/ream:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: repo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
